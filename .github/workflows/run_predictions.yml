name: Scheduled Prediction Pipeline

on:
  schedule:
    # 07:00 BRT = 10:00 UTC (Turno da Manhã)
    - cron: '0 10 * * *'
    # 13:00 BRT = 16:00 UTC (Turno da Tarde/Noite)
    - cron: '0 16 * * *'
  # Permite disparar manualmente pelo celular a qualquer hora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Prediction Engine
        run: python engine/pipeline.py

      - name: Commit and Push Updated Predictions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions_today.json
          git commit -m "update: previsões diárias atualizadas" || exit 0
          git push