name: Preditor Quant Pipeline

on:
  schedule:
    # 07:00 BRT (10:00 UTC) e 13:00 BRT (16:00 UTC)
    - cron: '0 10 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pipeline de Previsões
        run: |
          python engine/pipeline.py

      - name: Commit e Push dos Dados Atualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions_today.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): atualizar previsoes diarias [skip ci]" && git push)

      - name: Wake-up Streamlit App (Ping HTTP)
        run: |
          echo "Disparando sinal de wake-up para o Streamlit Cloud..."
          curl -s -L --max-time 30 "https://sports-predictor-ewduq52jnzijparqrrslwp.streamlit.app/" > /dev/null || true
          echo "Ping concluído com sucesso."