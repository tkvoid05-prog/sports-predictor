name: Atualizar Dados do Preditor

on:
  schedule:
    # Roda todo dia às 10:00 UTC (07:00 BRT)
    - cron: '0 10 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pipeline
        run: |
          python -m engine.pipeline

      - name: Commitar e Push do JSON atualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions_today.json
          # Commita apenas se houver mudanças
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualizar predictions_today.json [skip ci]" && git push)